workflow_version: "0.4"
topic: ""
audience: "技术研发、产品和产业决策人员"
language: "zh-CN"
as_of: ""

decisions:
  - "读者需要据此做出的主要技术或工程决定"

scope:
  include: [academic, engineering, industry, standards, maturity]
  exclude: [patents]

report:
  report_type: "technical-survey"
  formats: [markdown, html, pdf]
  primary_output: "REPORT.md"
  companion_outputs: [EXECUTIVE_BRIEF.md, EVIDENCE_ATLAS.md]
  style: "professional-readable"
  narrative: "mechanism-evidence-boundary-judgment"
  visuals: "evidence-driven"
  quality_profile: "doctoral"

quality:
  require_primary_sources: true
  require_counter_evidence: true
  require_negative_evidence: true
  require_independent_review: true
  require_reader_editor_review: true
  require_report_type_fit: true
  require_companion_outputs: true
  allow_ready_with_limitations: true
  minimum_body_citations: 20
  maximum_reader_headings: 45
  maximum_process_headings: 0
  maximum_process_meta_mentions: 0
  minimum_figures: 5
  minimum_tables: 5
  minimum_synthesis_figures: 3
  minimum_quantitative_figures: 2
  minimum_multi_source_figures: 2
  minimum_experiment_rows: 8
  minimum_data_points: 6
  minimum_full_text_academic_sources: 15
  minimum_primary_research_sources: 10
  require_experiment_matrix: true
  require_visual_plan: true
  require_figure_register: true
  require_rendered_review: true
  final_human_acceptance_required: true
